[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-ads-mcp"
version = "0.1.0"
description = "MCP server for the Apple Ads Platform API (App Store and Apple Maps campaigns, reports, insights and recommendations), with dry-run, an audit log and spend guards."
readme = "README.md"
requires-python = ">=3.10"
# Private repository; no licence has been chosen yet. See README.md.
license = { text = "Proprietary (unlicensed, all rights reserved)" }
authors = [{ name = "AI Shopping Feeds" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "apple-ads",
    "apple-ads-platform-api",
    "app-store-ads",
    "app-marketing",
    "claude",
    "agent-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp"
Changelog = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp/blob/main/CHANGELOG.md"

[project.scripts]
apple-ads-mcp = "apple_ads_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_ads_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
