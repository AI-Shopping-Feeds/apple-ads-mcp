[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "apple-ads-mcp"
version = "0.1.0"
description = "MCP server for the Apple Ads Platform API (App Store and Apple Maps campaigns, reports, insights and recommendations), with dry-run, an audit log and spend guards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Shopping Feeds" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "apple-ads",
    "apple-ads-platform-api",
    "app-store-ads",
    "app-marketing",
    "claude",
    "agent-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "click>=8.5.0",
    "PyJWT[crypto]>=2.15.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]
dev = [
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "build>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp"
Documentation = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp#readme"
Repository = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp"
Issues = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp/issues"
Changelog = "https://github.com/AI-Shopping-Feeds/apple-ads-mcp/blob/main/CHANGELOG.md"

[project.scripts]
apple-ads-mcp = "apple_ads_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_ads_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
